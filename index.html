<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enhanced Neon Dash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #06040d;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .neon-text-main { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff; }
        .neon-text-danger { text-shadow: 0 0 10px #f00, 0 0 20px #f00, 0 0 40px #f00; }
        #uiLayer { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <!-- The rest of your game code (canvas, uiLayer, etc) starts here -->

    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-10">
        
        <!-- Main Menu -->
        <div id="menuScreen" class="flex flex-col items-center pointer-events-auto bg-black/60 p-10 rounded-2xl border border-cyan-500/50 backdrop-blur-sm shadow-[0_0_50px_rgba(0,255,255,0.2)]">
            <h1 class="text-5xl md:text-7xl font-black text-white mb-2 tracking-widest neon-text-main italic">NEON DASH</h1>
            <h2 class="text-cyan-400 text-xl font-bold tracking-[0.2em] mb-8">OVERDRIVE</h2>
            <p class="text-gray-300 text-center text-sm md:text-base mb-6 max-w-md">
                Jump: Tap, Click, or Spacebar<br>
                Hit <span class="text-yellow-400 font-bold">Yellow Rings</span> in mid-air to jump again!<br>
                Hold to fly in Ship Mode.
            </p>
            <h3 class="text-white text-lg mb-4 font-bold tracking-widest uppercase">Select Difficulty</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-md">
                <button class="diff-btn flex flex-col items-center justify-center px-6 py-2 bg-transparent border-2 border-green-400 text-green-400 font-bold rounded-lg uppercase tracking-wider hover:bg-green-400 hover:text-black transition-all shadow-[0_0_10px_rgba(74,222,128,0.5)] hover:shadow-[0_0_25px_rgba(74,222,128,1)]" data-diff="easy">
                    <span class="text-lg pointer-events-none">Easy</span>
                    <span class="text-xs font-normal pointer-events-none" id="best-easy">Best: 0</span>
                </button>
                <button class="diff-btn flex flex-col items-center justify-center px-6 py-2 bg-transparent border-2 border-yellow-400 text-yellow-400 font-bold rounded-lg uppercase tracking-wider hover:bg-yellow-400 hover:text-black transition-all shadow-[0_0_10px_rgba(250,204,21,0.5)] hover:shadow-[0_0_25px_rgba(250,204,21,1)]" data-diff="medium">
                    <span class="text-lg pointer-events-none">Medium</span>
                    <span class="text-xs font-normal pointer-events-none" id="best-medium">Best: 0</span>
                </button>
                <button class="diff-btn flex flex-col items-center justify-center px-6 py-2 bg-transparent border-2 border-orange-400 text-orange-400 font-bold rounded-lg uppercase tracking-wider hover:bg-orange-400 hover:text-black transition-all shadow-[0_0_10px_rgba(251,146,60,0.5)] hover:shadow-[0_0_25px_rgba(251,146,60,1)]" data-diff="hard">
                    <span class="text-lg pointer-events-none">Hard</span>
                    <span class="text-xs font-normal pointer-events-none" id="best-hard">Best: 0</span>
                </button>
                <button class="diff-btn flex flex-col items-center justify-center px-6 py-2 bg-transparent border-2 border-red-500 text-red-500 font-bold rounded-lg uppercase tracking-wider hover:bg-red-500 hover:text-black transition-all shadow-[0_0_10px_rgba(239,68,68,0.5)] hover:shadow-[0_0_25px_rgba(239,68,68,1)]" data-diff="hardest">
                    <span class="text-lg pointer-events-none">Hardest</span>
                    <span class="text-xs font-normal pointer-events-none" id="best-hardest">Best: 0</span>
                </button>
                <button class="diff-btn md:col-span-2 flex flex-col items-center justify-center px-6 py-2 bg-transparent border-2 border-purple-500 text-purple-500 font-bold rounded-lg uppercase tracking-wider hover:bg-purple-500 hover:text-black transition-all shadow-[0_0_10px_rgba(168,85,247,0.5)] hover:shadow-[0_0_25px_rgba(168,85,247,1)]" data-diff="impossible">
                    <span class="text-lg pointer-events-none">Impossible</span>
                    <span class="text-xs font-normal pointer-events-none" id="best-impossible">Best: 0</span>
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden flex-col items-center pointer-events-auto bg-black/80 p-10 rounded-2xl border border-red-500/50 backdrop-blur-md shadow-[0_0_50px_rgba(255,0,0,0.3)]">
            <h1 class="text-5xl md:text-7xl font-black text-white mb-4 tracking-widest neon-text-danger">SHATTERED</h1>
            <p id="finalScore" class="text-white text-3xl mb-2 font-mono font-bold">Score: 0</p>
            <p id="bestScore" class="text-red-400 text-lg mb-8 font-mono">Best: 0</p>
            <div class="flex gap-4">
                <button id="menuBtn" class="px-8 py-3 bg-transparent border-2 border-gray-400 text-gray-400 font-bold text-lg rounded-lg uppercase tracking-wider hover:bg-gray-400 hover:text-black transition-all">Menu</button>
                <button id="restartBtn" class="px-8 py-3 bg-transparent border-2 border-red-500 text-red-500 font-bold text-lg rounded-lg uppercase tracking-wider hover:bg-red-500 hover:text-black transition-all shadow-[0_0_15px_#f00] hover:shadow-[0_0_30px_#f00]">Retry</button>
            </div>
        </div>

        <!-- Victory Screen -->
        <div id="victoryScreen" class="hidden flex-col items-center pointer-events-auto bg-black/80 p-10 rounded-2xl border border-yellow-400/50 backdrop-blur-md shadow-[0_0_50px_rgba(250,204,21,0.3)]">
            <h1 class="text-5xl md:text-7xl font-black text-white mb-4 tracking-widest neon-text-main" style="text-shadow: 0 0 10px #ffea00, 0 0 20px #ffea00;">VICTORY</h1>
            <p class="text-white text-3xl mb-2 font-mono font-bold">Level Complete!</p>
            <p id="victoryScore" class="text-yellow-400 text-lg mb-8 font-mono">Score: 1500</p>
            <div class="flex gap-4">
                <button id="victoryMenuBtn" class="px-8 py-3 bg-transparent border-2 border-gray-400 text-gray-400 font-bold text-lg rounded-lg uppercase tracking-wider hover:bg-gray-400 hover:text-black transition-all shadow-[0_0_15px_#fff] hover:shadow-[0_0_30px_#fff]">Menu</button>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden absolute top-0 left-0 w-full pointer-events-none z-0 pt-4 px-4 flex flex-col items-center">
        <!-- Progress Bar -->
        <div class="w-full max-w-2xl">
            <div class="w-full h-3 bg-gray-800/80 rounded-full overflow-hidden border border-gray-700 relative backdrop-blur-sm">
                <div id="progressBar" class="h-full bg-cyan-400 w-0 transition-all duration-200"></div>
            </div>
            <div class="text-center mt-1">
                <span id="progressText" class="text-cyan-400 font-mono font-bold text-lg drop-shadow-[0_0_5px_#0ff]">0%</span>
            </div>
        </div>
        <p id="scoreDisplay" class="text-white text-3xl font-mono font-bold drop-shadow-[0_0_10px_#fff] absolute top-4 right-8">0</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI
        const menuScreen = document.getElementById('menuScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const victoryScreen = document.getElementById('victoryScreen');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        
        // Colors & Config
        const colors = {
            bg: '#06040d',
            cyan: '#00e5ff',
            purple: '#b000ff',
            red: '#ff003c',
            yellow: '#ffea00',
            green: '#00ff66',
            orange: '#ff8800',
            blue: '#0066ff'
        };

        const config = {
            baseSpeed: 550,
            gravity: 4500, // snappier fall
            jumpForce: -1350,
            padJumpForce: -1650, 
            ringJumpForce: -1200, 
            shipThrust: -6000,
            playerSize: 36,
            groundHeight: 120
        };

        // Seeded PRNG Function (Mulberry32)
        function mulberry32(a) {
            return function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }
        let rand = Math.random; // Will be overwritten with seeded PRNG on start

        // Difficulty Seeds
        const diffSeeds = {
            easy: 101,
            medium: 202,
            hard: 303,
            hardest: 404,
            impossible: 505
        };

        // Config for generation pools (Crushers excluded entirely)
        const chunkPools = {
            easy: ['spawnSimpleBlocks', 'spawnSequenceSpikes', 'spawnSpikePit', 'spawnCeilingHazards'],
            medium: ['spawnSimpleBlocks', 'spawnMovingStairs', 'spawnSpikePit', 'spawnPadJump', 'spawnCeilingHazards', 'spawnSequenceSpikes'],
            hard: ['spawnSpikePit', 'spawnRingJump', 'spawnMovingStairs', 'spawnSawTunnel', 'spawnPadJump', 'spawnDualHazards', 'spawnSequenceSpikes'],
            hardest: ['spawnShipSection', 'spawnHardCombo', 'spawnSawTunnel', 'spawnGravitySection', 'spawnMovingStairs', 'spawnDualHazards', 'spawnRingJump'],
            impossible: ['spawnImpossibleTunnel', 'spawnShipSection', 'spawnHardCombo', 'spawnGravitySection', 'spawnDualHazards', 'spawnSawTunnel']
        };

        // Difficulty Settings with dynamic pools
        const difficultySettings = {
            easy: { speed: 350, gapMult: 3.5, pool: chunkPools.easy },
            medium: { speed: 500, gapMult: 2.0, pool: chunkPools.medium },
            hard: { speed: 650, gapMult: 1.2, pool: chunkPools.hard },
            hardest: { speed: 800, gapMult: 0.8, pool: chunkPools.hardest },
            impossible: { speed: 1050, gapMult: 0.4, pool: chunkPools.impossible }
        };

        // Best Scores & Progression
        let bestScores = JSON.parse(localStorage.getItem('neonDashScores')) || {
            easy: 0, medium: 0, hard: 0, hardest: 0, impossible: 0
        };
        const targetScore = 1500; // Target score is 1500

        function updateMenuBestScores() {
            document.getElementById('best-easy').innerText = `Best: ${bestScores.easy}`;
            document.getElementById('best-medium').innerText = `Best: ${bestScores.medium}`;
            document.getElementById('best-hard').innerText = `Best: ${bestScores.hard}`;
            document.getElementById('best-hardest').innerText = `Best: ${bestScores.hardest}`;
            document.getElementById('best-impossible').innerText = `Best: ${bestScores.impossible}`;
        }

        // State
        let state = 'menu';
        let currentDiff = 'medium';
        let lastTime = 0;
        let distance = 0;
        let speedMultiplier = 1.0;
        let globalTime = 0;
        let groundY = 0;
        let shakeTime = 0;
        
        // Input
        let isInputHeld = false;
        let inputJustPressed = false;

        // Entities
        let player = {};
        let obstacles = [];
        let particles = [];
        
        let nextSpawnDistance = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            groundY = canvas.height - config.groundHeight;
            if(state === 'menu') {
                resetPlayer();
                draw();
            }
        }
        window.addEventListener('resize', resize);

        // Input Setup
        function handleInput(down) {
            if (down) {
                if (!isInputHeld) inputJustPressed = true;
                isInputHeld = true;
            } else {
                isInputHeld = false;
            }
        }

        window.addEventListener('keydown', e => { 
            if(e.code === 'Space') { 
                e.preventDefault(); 
                if (state === 'gameover') startGame();
                else handleInput(true); 
            }
        });
        window.addEventListener('keyup', e => { 
            if(e.code === 'Space') { 
                e.preventDefault(); 
                handleInput(false); 
            }
        });
        window.addEventListener('mousedown', (e) => { 
            if (e.target.tagName === 'BUTTON') return;
            if (state === 'gameover') startGame();
            else handleInput(true); 
        });
        window.addEventListener('mouseup', () => handleInput(false));
        window.addEventListener('touchstart', e => { 
            if (e.target.tagName === 'BUTTON') return;
            e.preventDefault(); 
            if (state === 'gameover') startGame();
            else handleInput(true); 
        }, {passive: false});
        window.addEventListener('touchend', e => { handleInput(false); });

        // Bind Difficulty Buttons
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                currentDiff = btn.getAttribute('data-diff');
                startGame();
            });
        });

        document.getElementById('restartBtn').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
        document.getElementById('menuBtn').addEventListener('click', (e) => { 
            e.stopPropagation(); 
            state = 'menu';
            gameOverScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            document.getElementById('uiLayer').style.backgroundColor = 'transparent';
            hud.classList.add('hidden');
            resetPlayer();
            obstacles = [];
            particles = [];
            distance = 0;
            draw();
        });

        document.getElementById('victoryMenuBtn').addEventListener('click', (e) => { 
            e.stopPropagation(); 
            state = 'menu';
            victoryScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
            document.getElementById('uiLayer').style.backgroundColor = 'transparent';
            hud.classList.add('hidden');
            resetPlayer();
            obstacles = [];
            particles = [];
            distance = 0;
            draw();
        });

        function resetPlayer() {
            player = {
                x: canvas.width * 0.2,
                y: groundY - config.playerSize,
                size: config.playerSize,
                vy: 0,
                isGrounded: true,
                rotation: 0,
                mode: 'cube',
                color: colors.cyan,
                gravityMod: 1
            };
        }

        function triggerShake(duration) {
            shakeTime = duration;
        }

        function spawnParticles(x, y, color, count, speedMod = 1) {
            // Visual particles capped to maintain solid 60 FPS
            const actualCount = Math.min(count, 15);
            if (particles.length > 50) particles.splice(0, particles.length - 50);
            for(let i=0; i<actualCount; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 600 * speedMod,
                    vy: (Math.random() - 0.5) * 600 * speedMod - 100,
                    life: 1.0,
                    decay: 1.2 + Math.random() * 2,
                    color: Math.random() > 0.3 ? color : '#ffffff',
                    size: Math.random() * 3 + 2
                });
            }
        }

        // --- Procedural Generation (Seeded) ---
        function addObj(type, x, y, w, h, extra = {}) {
            obstacles.push({ type, x, y, w, h, passed: false, ...extra });
        }

        function spawnSimpleBlocks(startX, rng) {
            const s = config.playerSize;
            let endX = startX;
            const numBlocks = 2 + Math.floor(rng() * 3);
            for(let i=0; i<numBlocks; i++) {
                const hOffset = s * (1 + rng() * 1.5);
                addObj('block', endX, groundY - hOffset, s*(1.5 + rng()), s);
                endX += s * (4 + rng() * 2.5);
            }
            return endX - startX;
        }

        function spawnSequenceSpikes(startX, rng) {
            const s = config.playerSize;
            let endX = startX;
            const numSpikes = 2 + Math.floor(rng() * 3);
            for(let i=0; i<numSpikes; i++) {
                addObj('spike', endX, groundY - s, s, s);
                endX += s * (4 + rng() * 2);
            }
            return endX - startX;
        }

        function spawnHardCombo(startX, rng) {
            const s = config.playerSize;
            const sawY = groundY - s * (3 + rng() * 2);
            const ringY = groundY - s * (3.5 + rng() * 1.5);
            addObj('pad', startX, groundY - s/4, s, s/4);
            addObj('saw', startX + s*3, sawY, s*1.5, s*1.5);
            addObj('ring', startX + s*6, ringY, s*1.5, s*1.5);
            addObj('spike', startX + s*6, groundY - s, s, s);
            addObj('block', startX + s*(9 + rng()*2), groundY - s*(1.5 + rng()), s*2, s);
            return s * 13;
        }

        function spawnImpossibleTunnel(startX, rng) {
            const s = config.playerSize;
            const h1 = groundY - s * (2 + rng());
            const h2 = groundY - s * (2.5 + rng() * 1.5);
            addObj('spike', startX, groundY - s, s, s);
            addObj('saw', startX + s*2, h1, s*1.5, s*1.5);
            addObj('spike', startX + s*4, groundY - s, s, s);
            addObj('saw', startX + s*6, h2, s*1.5, s*1.5);
            addObj('spike', startX + s*8, groundY - s, s, s);
            return s * 11;
        }

        function spawnSpikePit(startX, rng) {
            const s = config.playerSize;
            const numSpikes = 2 + Math.floor(rng() * 3);
            for(let i=0; i<numSpikes; i++) {
                addObj('spike', startX + s*i, groundY - s, s, s);
            }
            addObj('block', startX + s*(numSpikes + 3 + rng()*2), groundY - s*2, s*2, s);
            return s * (numSpikes + 6);
        }

        function spawnMovingStairs(startX, rng) {
            const s = config.playerSize;
            const mSpeed1 = 2 + rng() * 3;
            const mSpeed2 = 2 + rng() * 3;
            const mAmp = s * (0.8 + rng() * 0.7);
            
            addObj('block', startX, groundY - s*2, s*2, s, { movingY: true, moveOffset: 0, moveAmp: mAmp, moveSpeed: mSpeed1 });
            addObj('block', startX + s*5, groundY - s*(3.5 + rng()), s*2, s, { movingY: true, moveOffset: Math.PI * rng(), moveAmp: mAmp, moveSpeed: mSpeed2 });
            addObj('spike', startX + s*3, groundY - s, s, s);
            return s * 10;
        }

        function spawnPadJump(startX, rng) {
            const s = config.playerSize;
            let wallDist = 4 + rng() * 3;
            let wallHeight = 3 + rng() * 2.5;
            
            addObj('pad', startX, groundY - s/4, s, s/4);
            addObj('block', startX + s*wallDist, groundY - s*wallHeight, s, s*wallHeight);
            addObj('spike', startX + s*wallDist, groundY - s*(wallHeight+1), s, s);
            addObj('block', startX + s*(wallDist + 3 + rng()*2), groundY - s*(1.5 + rng()), s*(3 + rng()*2), s*2);
            return s * (wallDist + 8);
        }

        function spawnRingJump(startX, rng) {
            const s = config.playerSize;
            const ringY = groundY - s * (3.5 + rng() * 2);
            const pitSize = 3 + Math.floor(rng() * 3);
            
            addObj('block', startX, groundY - s*(1 + rng()), s*2, s);
            addObj('ring', startX + s*5, ringY, s*1.5, s*1.5);
            
            for(let i=0; i<pitSize; i++) {
                addObj('spike', startX + s*(3+i), groundY - s, s, s);
            }
            
            addObj('block', startX + s*(pitSize + 4 + rng()), groundY - s*2, s*2, s*2);
            return s * (pitSize + 7);
        }

        function spawnSawTunnel(startX, rng) {
            const s = config.playerSize;
            const s1y = groundY - s * (1.5 + rng() * 1.5);
            const s2y = groundY - s * (2.5 + rng() * 1.5);
            
            addObj('saw', startX + s*3, s1y, s*1.5, s*1.5);
            addObj('saw', startX + s*(6 + rng()*2), s2y, s*1.5, s*1.5);
            if (rng() > 0.5) {
                addObj('saw', startX + s*(9 + rng()*2), s1y, s*1.5, s*1.5);
            }
            addObj('block', startX + s*6, groundY - s, s*2, s);
            return s * 14;
        }

        function spawnShipSection(startX, rng) {
            const s = config.playerSize;
            addObj('portal-ship', startX, groundY - s*3, s, s*3);
            
            let length = 4 + Math.floor(rng() * 4);
            let phase = rng() * Math.PI * 2;
            let amp = s * (1 + rng() * 1.5);
            
            for(let i=1; i<=length; i++) {
                let yOffset = Math.sin(i * 1.5 + phase) * amp;
                addObj('block', startX + s*5*i, groundY - s*8 + yOffset, s*2, s*2); // Roof
                addObj('block', startX + s*5*i, groundY - s*2 + yOffset, s*2, s*2); // Floor
                
                if (rng() > 0.4) {
                    let sawOffset = (rng() > 0.5 ? -s*4 : -s*2); // bias towards top or bottom
                    addObj('saw', startX + s*5*i + s, groundY + sawOffset + yOffset, s*1.2, s*1.2);
                }
            }
            
            addObj('portal-cube', startX + s*5*(length + 1), groundY - s*3, s, s*3);
            return s * 5 * (length + 2);
        }

        function spawnGravitySection(startX, rng) {
            const s = config.playerSize;
            addObj('portal-gravity-up', startX, groundY - s*3, s, s*3);
            
            const ceil1 = s * (2 + rng());
            
            addObj('block', startX + s*(3 + rng()*2), 0, s*3, s);
            addObj('spike', startX + s*5, s, s, s, {upsideDown: true});
            if (rng() > 0.5) addObj('spike', startX + s*6, s, s, s, {upsideDown: true});
            
            addObj('saw', startX + s*(9 + rng()*3), ceil1, s*1.5, s*1.5);
            addObj('block', startX + s*(13 + rng()*2), 0, s*3, s*2);
            
            addObj('portal-gravity-down', startX + s*18, groundY - s*3, s, s*3);
            return s * 21;
        }

        function spawnCeilingHazards(startX, rng) {
            const s = config.playerSize;
            const gap = 1 + rng();
            addObj('block', startX, 0, s*4, s*2);
            addObj('spike', startX + s, s*2, s, s, {upsideDown: true});
            addObj('spike', startX + s*(2 + rng()), s*2, s, s, {upsideDown: true});

            addObj('spike', startX + s*2, groundY - s, s, s);

            addObj('saw', startX + s*(5 + gap), s*(1.5 + rng()), s*1.5, s*1.5);
            addObj('block', startX + s*(5 + gap), groundY - s*(1.5 + rng()), s*2, s*2);

            return s * 11;
        }

        function spawnDualHazards(startX, rng) {
            const s = config.playerSize;
            addObj('spike', startX, 0, s, s, {upsideDown: true});
            addObj('spike', startX, groundY - s, s, s);

            addObj('saw', startX + s*(2.5 + rng()), s*(0.8 + rng()), s*1.5, s*1.5);
            addObj('block', startX + s*3, groundY - s*(1.5 + rng()), s*2, s*2);

            const endSpikeOff = s * (5.5 + rng() * 1.5);
            addObj('spike', startX + endSpikeOff, 0, s, s, {upsideDown: true});
            addObj('spike', startX + endSpikeOff + s, 0, s, s, {upsideDown: true});
            addObj('pad', startX + endSpikeOff, groundY - s/4, s, s/4);

            return s * 11;
        }

        function spawnChunk() {
            const settings = difficultySettings[currentDiff];
            const pool = settings.pool;
            // Use the seeded PRNG to pick the chunk
            const chunkName = pool[Math.floor(rand() * pool.length)];
            
            const startX = canvas.width + 100;
            let endOffset = 0;
            
            // Pass seeded PRNG into chunk generators
            if (chunkName === 'spawnSimpleBlocks') endOffset = spawnSimpleBlocks(startX, rand);
            else if (chunkName === 'spawnSpikePit') endOffset = spawnSpikePit(startX, rand);
            else if (chunkName === 'spawnMovingStairs') endOffset = spawnMovingStairs(startX, rand);
            else if (chunkName === 'spawnPadJump') endOffset = spawnPadJump(startX, rand);
            else if (chunkName === 'spawnRingJump') endOffset = spawnRingJump(startX, rand);
            else if (chunkName === 'spawnSawTunnel') endOffset = spawnSawTunnel(startX, rand);
            else if (chunkName === 'spawnShipSection') endOffset = spawnShipSection(startX, rand);
            else if (chunkName === 'spawnHardCombo') endOffset = spawnHardCombo(startX, rand);
            else if (chunkName === 'spawnImpossibleTunnel') endOffset = spawnImpossibleTunnel(startX, rand);
            else if (chunkName === 'spawnSequenceSpikes') endOffset = spawnSequenceSpikes(startX, rand);
            else if (chunkName === 'spawnGravitySection') endOffset = spawnGravitySection(startX, rand);
            else if (chunkName === 'spawnCeilingHazards') endOffset = spawnCeilingHazards(startX, rand);
            else if (chunkName === 'spawnDualHazards') endOffset = spawnDualHazards(startX, rand);
            
            const gap = config.playerSize * 6 * settings.gapMult;
            nextSpawnDistance = distance + endOffset + gap;
        }

        // --- Core Functions ---

        function startGame() {
            config.baseSpeed = difficultySettings[currentDiff].speed;
            
            // Initialize Seeded PRNG for the chosen difficulty
            rand = mulberry32(diffSeeds[currentDiff] || 1);

            resetPlayer();
            obstacles = [];
            particles = [];
            distance = 0;
            speedMultiplier = 1;
            nextSpawnDistance = 600;
            state = 'playing';
            shakeTime = 0;
            globalTime = 0;
            
            menuScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            victoryScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            document.getElementById('uiLayer').style.backgroundColor = 'transparent';
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            state = 'gameover';
            triggerShake(0.4);
            spawnParticles(player.x + player.size/2, player.y + player.size/2, player.color, 50, 1.5);
            
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            document.getElementById('uiLayer').style.backgroundColor = 'rgba(6, 4, 13, 0.7)';
            
            const currentScore = Math.floor(distance / 50);
            
            if (currentScore > bestScores[currentDiff]) {
                bestScores[currentDiff] = currentScore;
                localStorage.setItem('neonDashScores', JSON.stringify(bestScores));
                updateMenuBestScores();
            }
            
            document.getElementById('finalScore').innerText = `Score: ${currentScore}`;
            document.getElementById('bestScore').innerText = `Best: ${bestScores[currentDiff]}`;
        }

        function winLevel() {
            state = 'victory';
            hud.classList.add('hidden');
            victoryScreen.classList.remove('hidden');
            document.getElementById('uiLayer').style.backgroundColor = 'rgba(6, 4, 13, 0.7)';
            
            const currentScore = Math.floor(distance / 50);
            if (currentScore > bestScores[currentDiff]) {
                bestScores[currentDiff] = currentScore;
                localStorage.setItem('neonDashScores', JSON.stringify(bestScores));
                updateMenuBestScores();
            }
            document.getElementById('victoryScore').innerText = `Score: ${currentScore}`;
        }

        function gameLoop(time) {
            if (state !== 'playing' && state !== 'gameover' && state !== 'victory') return;
            
            const dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;
            globalTime += dt;

            update(dt);
            draw();

            if (state === 'playing' || particles.length > 0 || shakeTime > 0) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Circle collision helper
        function circleIntersectRect(cx, cy, cr, rx, ry, rw, rh) {
            let testX = cx;
            let testY = cy;
            
            if (cx < rx) testX = rx; else if (cx > rx + rw) testX = rx + rw;
            if (cy < ry) testY = ry; else if (cy > ry + rh) testY = ry + rh;
            
            let distX = cx - testX;
            let distY = cy - testY;
            let distance = Math.sqrt((distX*distX) + (distY*distY));
            return distance <= cr;
        }

        function update(dt) {
            if (shakeTime > 0) shakeTime -= dt;

            if (state === 'playing') {
                speedMultiplier = 1 + (distance / 40000);
                const currentSpeed = config.baseSpeed * speedMultiplier;
                
                distance += currentSpeed * dt;
                
                const currentScore = Math.floor(distance / 50);
                scoreDisplay.innerText = currentScore;
                
                let progress = Math.min(100, Math.floor((currentScore / targetScore) * 100));
                progressBar.style.width = progress + '%';
                
                if (progress >= 100) {
                    progressText.innerText = 'LEVEL COMPLETE!';
                    progressBar.style.backgroundColor = '#fff';
                    progressBar.style.boxShadow = '0 0 15px #0ff';
                    progressText.style.color = '#fff';
                    progressText.style.textShadow = '0 0 10px #0ff';
                    winLevel();
                    return;
                } else {
                    progressText.innerText = progress + '%';
                    progressBar.style.backgroundColor = '#22d3ee';
                    progressBar.style.boxShadow = 'none';
                    progressText.style.color = '#22d3ee';
                    progressText.style.textShadow = 'none';
                }

                if (distance > nextSpawnDistance) spawnChunk();

                // Player Physics & Logic
                player.prevY = player.y; 
                let jumpedViaRing = false;

                if (player.mode === 'cube') {
                    // Check Ring Interactions
                    if (inputJustPressed && !player.isGrounded) {
                        for (let obs of obstacles) {
                            if (obs.type === 'ring' && !obs.used) {
                                const cx = obs.x + obs.w/2;
                                const cy = obs.y + obs.h/2;
                                const px = player.x + player.size/2;
                                const py = player.y + player.size/2;
                                const dist = Math.hypot(cx - px, cy - py);
                                
                                if (dist < obs.w * 1.5) { 
                                    player.vy = config.ringJumpForce * player.gravityMod;
                                    obs.used = true;
                                    jumpedViaRing = true;
                                    spawnParticles(cx, cy, colors.yellow, 15, 0.5);
                                    inputJustPressed = false; 
                                    break;
                                }
                            }
                        }
                    }

                    // Normal Jump 
                    if (isInputHeld && player.isGrounded) {
                        player.vy = config.jumpForce * player.gravityMod;
                        player.isGrounded = false;
                        inputJustPressed = false;
                    }

                    player.vy += config.gravity * player.gravityMod * dt;
                    if (!player.isGrounded && !jumpedViaRing) {
                        player.rotation += 6 * dt * player.gravityMod; 
                    }
                } else if (player.mode === 'ship') {
                    if (isInputHeld) {
                        player.vy += config.shipThrust * player.gravityMod * dt;
                        if (Math.random() < 0.5) { // Visual effects use normal random
                            spawnParticles(player.x, (player.gravityMod === 1 ? player.y + player.size : player.y), colors.yellow, 1, 0.2);
                        }
                    } else {
                        player.vy += (config.gravity * 0.7) * player.gravityMod * dt;
                    }
                    
                    player.vy = Math.max(-700, Math.min(player.vy, 700));
                    player.rotation = player.vy * 0.001 * player.gravityMod; 
                }

                inputJustPressed = false;
                player.y += player.vy * dt;
                player.isGrounded = false;
                let landedOnBlock = false;

                // Obstacle Update & Collision
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= currentSpeed * dt;

                    if (obs.type === 'block' && obs.movingY) {
                        obs.currentY = obs.y + Math.sin(globalTime * obs.moveSpeed + obs.moveOffset) * obs.moveAmp;
                    } else {
                        obs.currentY = obs.y;
                    }

                    if (obs.x + obs.w < -100) {
                        obstacles.splice(i, 1);
                        continue;
                    }

                    // --- Collision Detection ---
                    const px = player.x;
                    const py = player.y;
                    const ps = player.size;

                    if (obs.type === 'saw') {
                        const r = obs.w/2 - 4; 
                        if (circleIntersectRect(obs.x + obs.w/2, obs.currentY + obs.h/2, r, px, py, ps, ps)) {
                            gameOver();
                        }
                    } else if (obs.type === 'ring') {
                        // Managed above
                    } else {
                        // Rectangular AABB Broad phase
                        if (px < obs.x + obs.w && px + ps > obs.x && py < obs.currentY + obs.h && py + ps > obs.currentY) {
                            
                            if (obs.type === 'spike') {
                                const pad = 6;
                                if (px + pad < obs.x + obs.w - pad && px + ps - pad > obs.x + pad &&
                                    py + pad < obs.currentY + obs.h && py + ps > obs.currentY + pad) {
                                    gameOver();
                                }
                            } else if (obs.type === 'pad') {
                                player.vy = config.padJumpForce * player.gravityMod;
                                player.isGrounded = false;
                                player.y = player.gravityMod === 1 ? obs.currentY - ps : obs.currentY + obs.h;
                                spawnParticles(obs.x + obs.w/2, obs.currentY, colors.yellow, 10, 0.5);
                            } else if (obs.type === 'portal-ship') {
                                player.mode = 'ship';
                                player.color = colors.green;
                            } else if (obs.type === 'portal-cube') {
                                player.mode = 'cube';
                                player.color = colors.cyan;
                                player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                            } else if (obs.type === 'portal-gravity-up') {
                                player.gravityMod = -1;
                            } else if (obs.type === 'portal-gravity-down') {
                                player.gravityMod = 1;
                            } else if (obs.type === 'block') {
                                const prevBottom = player.prevY + ps;
                                
                                if (player.gravityMod === 1) {
                                    if (prevBottom <= obs.currentY + 8 && player.vy >= 0) {
                                        player.y = obs.currentY - ps;
                                        player.vy = obs.movingY ? (Math.cos(globalTime * obs.moveSpeed + obs.moveOffset) * obs.moveAmp * obs.moveSpeed) : 0;
                                        player.isGrounded = true;
                                        landedOnBlock = true;
                                        if (player.mode === 'cube') {
                                            player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                                        }
                                    } else if (player.mode === 'ship' && player.prevY >= obs.currentY + obs.h - 8 && player.vy < 0) {
                                        player.y = obs.currentY + obs.h;
                                        player.vy = 0;
                                    } else {
                                        gameOver(); 
                                    }
                                } else {
                                    if (player.prevY >= obs.currentY + obs.h - 8 && player.vy <= 0) {
                                        player.y = obs.currentY + obs.h;
                                        player.vy = obs.movingY ? (Math.cos(globalTime * obs.moveSpeed + obs.moveOffset) * obs.moveAmp * obs.moveSpeed) : 0;
                                        player.isGrounded = true;
                                        landedOnBlock = true;
                                        if (player.mode === 'cube') {
                                            player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                                        }
                                    } else if (player.mode === 'ship' && prevBottom <= obs.currentY + 8 && player.vy > 0) {
                                        player.y = obs.currentY - ps;
                                        player.vy = 0;
                                    } else {
                                        gameOver(); 
                                    }
                                }
                            }
                        }
                    }
                }

                // Ground Collision
                if (player.gravityMod === 1) {
                    if (player.y + player.size >= groundY && !landedOnBlock) {
                        player.y = groundY - player.size;
                        player.vy = 0;
                        player.isGrounded = true;
                        if (player.mode === 'cube') {
                            player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                        }
                    }
                    if (player.mode === 'ship' && player.y < 0) {
                        player.y = 0;
                        player.vy = 0;
                    }
                } else {
                    if (player.y <= 0 && !landedOnBlock) {
                        player.y = 0;
                        player.vy = 0;
                        player.isGrounded = true;
                        if (player.mode === 'cube') {
                            player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
                        }
                    }
                    if (player.mode === 'ship' && player.y + player.size > groundY) {
                        player.y = groundY - player.size;
                        player.vy = 0;
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.vy += config.gravity * 0.5 * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt * p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.save();
            
            if (shakeTime > 0) {
                const mag = (shakeTime / 0.4) * 15;
                ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
            }

            // Clear Background
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parallax Grids (Fast stroke calls)
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(176, 0, 255, 0.15)';
            const bgOffset = (distance * 0.2) % 100;
            ctx.beginPath();
            for(let x = -bgOffset; x < canvas.width; x += 100) { ctx.moveTo(x, 0); ctx.lineTo(x, groundY); }
            for(let y = groundY; y >= 0; y -= 100) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0, 229, 255, 0.2)';
            const fgOffset = distance % 60;
            ctx.beginPath();
            for(let x = -fgOffset; x < canvas.width; x += 60) { ctx.moveTo(x, groundY); ctx.lineTo(x + 200, canvas.height); }
            ctx.stroke();

            // High-Performance Neon Floor (Layered translucent strokes instead of shadowBlur)
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
            ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();
            
            ctx.strokeStyle = colors.cyan;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();
            
            ctx.fillStyle = '#020106'; 
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Draw Obstacles (Fast stroke overlays instead of CPU Gaussian Blurs)
            obstacles.forEach(obs => {
                const drawY = obs.currentY !== undefined ? obs.currentY : obs.y;

                if (obs.type === 'block') {
                    const cColor = colors.purple;

                    // Simulated Neon Glow Stroke
                    ctx.strokeStyle = 'rgba(176, 0, 255, 0.3)';
                    ctx.lineWidth = 6;
                    ctx.strokeRect(obs.x - 2, drawY - 2, obs.w + 4, obs.h + 4);

                    ctx.strokeStyle = cColor;
                    ctx.fillStyle = 'rgba(176, 0, 255, 0.12)';
                    ctx.lineWidth = 2;
                    ctx.fillRect(obs.x, drawY, obs.w, obs.h);
                    ctx.strokeRect(obs.x, drawY, obs.w, obs.h);
                    
                    ctx.beginPath(); ctx.moveTo(obs.x+4, drawY+4); ctx.lineTo(obs.x+obs.w-4, drawY+4); ctx.stroke();
                } 
                else if (obs.type === 'spike') {
                    // Outer glow pass
                    ctx.strokeStyle = 'rgba(255, 0, 60, 0.4)';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    if (obs.upsideDown) {
                        ctx.moveTo(obs.x, drawY);
                        ctx.lineTo(obs.x + obs.w / 2, drawY + obs.h);
                        ctx.lineTo(obs.x + obs.w, drawY);
                    } else {
                        ctx.moveTo(obs.x, drawY + obs.h);
                        ctx.lineTo(obs.x + obs.w / 2, drawY);
                        ctx.lineTo(obs.x + obs.w, drawY + obs.h);
                    }
                    ctx.closePath();
                    ctx.stroke();

                    // Core pass
                    ctx.fillStyle = colors.red;
                    ctx.fill();
                    
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    if (obs.upsideDown) {
                        ctx.moveTo(obs.x + obs.w/2 - 2, drawY + obs.h - 8);
                        ctx.lineTo(obs.x + obs.w/2 + 2, drawY + obs.h - 8);
                        ctx.lineTo(obs.x + obs.w/2, drawY + obs.h - 2);
                    } else {
                        ctx.moveTo(obs.x + obs.w/2 - 2, drawY + 8);
                        ctx.lineTo(obs.x + obs.w/2 + 2, drawY + 8);
                        ctx.lineTo(obs.x + obs.w/2, drawY + 2);
                    }
                    ctx.fill();
                }
                else if (obs.type === 'pad') {
                    ctx.fillStyle = colors.yellow;
                    ctx.fillRect(obs.x, drawY, obs.w, obs.h);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(obs.x + 4, drawY + 2, obs.w - 8, obs.h/2);
                }
                else if (obs.type === 'saw') {
                    const cx = obs.x + obs.w/2;
                    const cy = drawY + obs.h/2;
                    const r = obs.w/2;
                    
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(globalTime * -15);
                    
                    // Glow ring
                    ctx.strokeStyle = 'rgba(255, 0, 60, 0.4)';
                    ctx.lineWidth = 6;
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke();

                    ctx.fillStyle = 'rgba(255,0,60,0.2)';
                    ctx.strokeStyle = colors.red;
                    ctx.lineWidth = 2;
                    
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    
                    ctx.beginPath();
                    for(let i=0; i<8; i++) {
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(i*Math.PI/4) * (r+6), Math.sin(i*Math.PI/4) * (r+6));
                    }
                    ctx.stroke();
                    
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                }
                else if (obs.type === 'ring') {
                    const cx = obs.x + obs.w/2;
                    const cy = drawY + obs.h/2;
                    const r = obs.w/2;
                    
                    ctx.strokeStyle = obs.used ? 'rgba(85,85,85,0.4)' : 'rgba(255, 234, 0, 0.4)';
                    ctx.lineWidth = 8;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r + Math.sin(globalTime*10)*2, 0, Math.PI*2);
                    ctx.stroke();

                    ctx.strokeStyle = obs.used ? '#555' : colors.yellow;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r + Math.sin(globalTime*10)*2, 0, Math.PI*2);
                    ctx.stroke();
                    
                    ctx.fillStyle = obs.used ? '#222' : '#fff';
                    ctx.beginPath();
                    ctx.arc(cx, cy, r*0.4, 0, Math.PI*2);
                    ctx.fill();
                }
                else if (obs.type.startsWith('portal')) {
                    let pColor = colors.cyan;
                    if (obs.type === 'portal-ship') pColor = colors.green;
                    else if (obs.type === 'portal-gravity-up') pColor = colors.orange;
                    else if (obs.type === 'portal-gravity-down') pColor = colors.blue;
                    
                    ctx.strokeStyle = pColor;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.w/2, drawY + obs.h/2, obs.w/4, obs.h/2, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.fillStyle = pColor;
                    ctx.globalAlpha = 0.2 + Math.sin(globalTime*8)*0.1;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            });

            if (state === 'playing') {
                ctx.save();
                ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
                ctx.rotate(player.rotation);
                ctx.scale(1, player.gravityMod); 
                
                // Fast Player Glow Outline
                ctx.strokeStyle = player.color;
                ctx.lineWidth = 4;
                ctx.globalAlpha = 0.4;
                if (player.mode === 'cube') {
                    ctx.strokeRect(-player.size / 2 - 2, -player.size / 2 - 2, player.size + 4, player.size + 4);
                }
                ctx.globalAlpha = 1.0;

                ctx.fillStyle = player.color;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                
                if (player.mode === 'cube') {
                    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                    ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
                    
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-player.size/3, -player.size/4, player.size/5, player.size/5); 
                    ctx.fillRect(player.size/8, -player.size/4, player.size/5, player.size/5); 
                    ctx.fillRect(-player.size/3, player.size/6, player.size/1.5, player.size/8);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(-player.size/2, -player.size/3); 
                    ctx.lineTo(player.size/2 + 5, 0); 
                    ctx.lineTo(-player.size/2, player.size/3); 
                    ctx.lineTo(-player.size/3, 0); 
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(0, 0, player.size/5, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }

            if (particles.length > 0) {
                particles.forEach(p => {
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                });
                ctx.globalAlpha = 1.0;
            }

            ctx.restore(); 
        }

        // Init
        resize();
        updateMenuBestScores();
        draw();

    </script>
